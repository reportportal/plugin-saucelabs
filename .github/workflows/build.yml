name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - develop
      - feature/**
    paths-ignore:
      - '.github/**'
      - README.md
      - gradle.properties

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup git credentials
        uses: oleksiyrudenko/gha-git-credentials@v2
        with:
          name: 'reportportal.io'
          email: 'support@reportportal.io'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Gradle
        id: build
        run: ./gradlew build --stacktrace

      # ✅ Reuse centralized upload workflow
      - name: Upload plugin artifact to S3
        if: github.ref_name == 'develop' || startsWith(github.ref_name, 'feature/')
        uses: reportportal/.github/.github/workflows/upload-plugin-artifact.yaml@main
        with:
          plugin_name: ${{ github.event.repository.name }}
          branch_name: ${{ github.ref_name }}
          run_number: ${{ github.run_number }}
