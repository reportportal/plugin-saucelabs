name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - develop
      - feature/**
    paths-ignore:
      - '.github/**'
      - README.md
      - gradle.properties

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup git credentials
        uses: oleksiyrudenko/gha-git-credentials@v2
        with:
          name: 'reportportal.io'
          email: 'support@reportportal.io'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Gradle
        id: build
        run: ./gradlew build

      - name: Configure AWS credentials
        if: github.ref_name == 'develop' || github.ref_name == 'feature/EPMRPP-109184'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload plugin artifact to S3
        if: github.ref_name == 'develop' || github.ref_name == 'feature/EPMRPP-109184'
        run: |
          PLUGIN_NAME=$(basename "${GITHUB_REPOSITORY}")
          aws s3 cp build/libs/*.jar \
            s3://${{ secrets.S3_PLUGIN_BUCKET }}/${PLUGIN_NAME}/${{ github.ref_name }}/build-${{ github.run_number }}/
